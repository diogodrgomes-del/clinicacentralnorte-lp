<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 900" width="700" height="900" role="img" aria-label="equipamentos">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12356F"/>
      <stop offset="1" stop-color="#2064D6"/>
    </linearGradient>
    <pattern id="p" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#ffffff" stroke-opacity=".05" stroke-width="10"/>
    </pattern>
  </defs>
  <rect width="700" height="900" fill="url(#g)"/>
  <rect width="700" height="900" fill="url(#p)"/>
  <g fill="#ffffff" fill-opacity=".55" font-family="Montserrat, Arial, sans-serif" text-anchor="middle">
    <text x="350" y="444" font-size="20" font-weight="700" letter-spacing="2">FOTO</text>
    <text x="350" y="472" font-size="15" font-weight="500">equipamentos</text>
